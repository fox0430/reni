name: Unit tests

on:
  pull_request:
    paths:
      - '.github/workflows/test.yml'
      - 'reni.nim*'
      - 'reni/**'
      - 'tests/**'
  push:
    paths:
      - '.github/workflows/test.yml'
      - 'reni.nim*'
      - 'reni/**'
      - 'tests/**'
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        nim-version:
          - '2.0.2'
          - '2.0.16'
          - 'stable'
          - 'devel'

    name: Tests on ${{ matrix.nim-version }}
    steps:
      - uses: actions/checkout@v6

      - name: Cache nimble
        id: cache-nimble
        uses: actions/cache@v5
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-v2-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nimble-v2-

      - name: Setup Nim (stable/release)
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
        if: matrix.nim-version != 'devel'

      - name: Setup Nim (devel)
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}
          use-nightlies: true
          repo-token: ${{ secrets.GITHUB_TOKEN }}
        if: matrix.nim-version == 'devel'

      - name: Run tests
        run: nimble test -y

      - name: Gen docs
        run: |
          nim doc --project --index:on --outdir:./htmldocs ./reni.nim

  tests-small-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Cache nimble
        id: cache-nimble
        uses: actions/cache@v5
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-v2-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nimble-v2-

      - name: Setup Nim (stable/release)
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Setup paths
        run: nimble setup -y

      - name: Run stack-budget tests with a tiny stack budget
        # The first-interval probing guard only fires under a small
        # -d:reniMaxStackBytes, so the default suite cannot observe it.
        # Scoped to test_stack_budget, which holds the guard tests: the full
        # conformance suites pin default-budget semantics and already run in
        # the matrix jobs. Compiling the full test_engine.nim here is
        # needlessly slow, especially under setjmp below.
        run: nim c -r -d:reniMaxStackBytes=16384 tests/test_stack_budget.nim

      - name: Run stack-budget tests with setjmp exceptions and no stack traces
        # The configuration the byte budget exists for: a recursion level costs
        # ~12 KB instead of ~750 B, and with stack traces off Nim's own
        # call-depth abort is gone, so the byte guard is the only thing between
        # a delegated construct in a quantifier body and a segfault. Every
        # other job builds with goto exceptions and traces on, where a missing
        # guard still answers rather than crashing.
        #
        # Not a release build: -O3 over setjmp's expanded control flow takes
        # tens of minutes on a large test file, and what is being exercised is
        # the frame size, which a debug build only makes larger. This step
        # targets the small guard file for the same reason: compiling the full
        # suite under setjmp costs ~10x a goto build.
        run: nim c -r --exceptions:setjmp --stacktrace:off tests/test_stack_budget.nim

  differential-fuzz:
    # Pinned, not ``ubuntu-latest``: this is the only job whose result depends
    # on a system library's behaviour rather than just its presence, and an
    # image migration that carries a newer Oniguruma would move the oracle
    # out from under a corpus the seed below holds still.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Cache nimble
        id: cache-nimble
        uses: actions/cache@v5
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-v2-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nimble-v2-

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Setup paths
        run: nimble setup -y

      - name: Install Oniguruma and PCRE2
        # The only job that links either: the differential test needs both as
        # oracles, and the rest of tests/ is pure Nim over ported JSON corpora.
        # The versions go in the log because a divergence this job reports is
        # only as pinned as the oracle that answered: if the image ever moves
        # them, the run that first disagreed says which ones it had.
        run: |
          sudo apt-get update
          sudo apt-get install -y libonig-dev libpcre2-dev
          dpkg-query -W -f '${Package} ${Version}\n' libonig-dev libpcre2-dev

      - name: Compare against Oniguruma on generated patterns
        # The conformance corpora pin the semantics that somebody wrote down.
        # This pins the ones nobody did -- which construct owns the rollback
        # for a capture, and how much state a given backtrack has to restore
        # -- by generating the combinations and asking the reference engine.
        # A release build: the default sweep is ~600k comparisons in about
        # five seconds there, and a debug build spends the budget on checks
        # the oracles do not share.
        #
        # The seed is the file's default, spelled out here so that widening
        # the sweep is a visible edit rather than a silent one.  It pins the
        # corpus: the generator draws from a PRNG the test file carries, not
        # from ``std/random``, so the Nim above can stay at ``stable`` -- this
        # job keeps testing the compiler everyone actually gets without a
        # release re-rolling the sweep onto shapes this seed was never
        # measured on.  What it does not pin is the answers: those come from
        # the oracles the image installs, which is why the image is pinned
        # too.  Only the default seed is known clean; the test file names the
        # divergences other seeds still hit.
        env:
          RENI_FUZZ_SEED: '20260912'
        run: nim c -r -d:release -d:reniFuzzDiff tests/test_fuzz_oniguruma.nim
